name: Tests y Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Tests con Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock
    
    - name: Lint con flake8
      run: |
        pip install flake8
        # Stop en E9,F63,F7,F82 (errors críticos)
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warnings (no fallar)
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Type check con mypy
      continue-on-error: true
      run: |
        pip install mypy
        mypy app/ --ignore-missing-imports || true
    
    - name: Tests unitarios
      env:
        GOOGLE_CLOUD_PROJECT: test-project
        GEMINI_API_KEY: test-key
      run: |
        pytest app/tests/ -v \
          -m "not integration" \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing
    
    - name: Upload coverage a Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install bandit
      run: pip install bandit[toml]
    
    - name: Security scan con bandit
      run: |
        bandit -r app/ -ll -f json -o bandit-report.json || true
        bandit -r app/ -ll
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install herramientas
      run: |
        pip install black isort flake8
    
    - name: Check formatting con black
      run: black --check app/
    
    - name: Check imports con isort
      run: isort --check-only app/
    
    - name: Lint con flake8
      run: flake8 app/ --max-line-length=100

  docs:
    name: Validar Documentación
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Validar links en markdown
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
        folder-path: 'docs/'
    
    - name: Check estructura de docs
      run: |
        echo "📚 Verificando estructura de documentación..."
        test -f docs/INDEX.md && echo "✅ INDEX.md existe"
        test -d docs/01-getting-started && echo "✅ 01-getting-started/ existe"
        test -d docs/02-architecture && echo "✅ 02-architecture/ existe"
        test -d docs/03-usage && echo "✅ 03-usage/ existe"
        test -d docs/04-development && echo "✅ 04-development/ existe"
        echo "✅ Estructura de documentación válida"

