configuration:
  environment_variables:
    google_cloud:
      - "GOOGLE_CLOUD_PROJECT: Proyecto con código SQL legacy"
      - "GOOGLE_APPLICATION_CREDENTIALS: Service account key"
    
    ai_services:
      - "GEMINI_API_KEY: Para embeddings y agentes"
      - "GEMINI_CHAT_MODEL: gemini-2.5-flash (SIEMPRE usar este modelo)"
      - "GEMINI_EMBEDDING_MODEL: gemini-embedding-001 (768 dims)"
    
    bigquery:
      - "BIGQUERY_DATASET: Dataset con objetos SQL"
      - "BIGQUERY_SOURCE_TABLE: Tabla con código legacy"
  
  input_requirements:
    table: "sql_objects_code"
    required_columns:
      - "server: Servidor origen"
      - "database: Base de datos"
      - "object_name: Nombre del objeto"
      - "object_type: Tipo (PROCEDURE, VIEW, etc.)"
      - "sql_code: Código SQL completo"
    
    scale: "Optimizado para millones de objetos"

scripts_democratization:
  structuring:
    - name: "run_bigquery_pipeline.py"
      purpose: "Estructurar código legacy completo"
      democratizes: "Ordena caos en conocimiento clasificado"
      usage: "python scripts/run_bigquery_pipeline.py"
  
  searching:
    - name: "bigquery_search_chunks.py"
      purpose: "Buscar código por intención"
      democratizes: "Encuentra sin conocer sintaxis exacta"
      modes:
        - "demo: Ejemplos de búsquedas semánticas"
        - "interactive: Pregunta libremente en lenguaje natural"
        - "patterns: Análisis de patrones del codebase"
  
  monitoring:
    - name: "monitor_pipeline.py"
      purpose: "Monitorear estructuración en tiempo real"
      democratizes: "Transparencia del proceso"

